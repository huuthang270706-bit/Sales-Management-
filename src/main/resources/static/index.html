<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Báo Cáo Doanh Thu</title>
    <!-- Thư viện Chart.js để vẽ biểu đồ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
        }

        .card.green {
            border-left-color: #2ecc71;
        }

        .card h3 {
            font-size: 14px;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #34495e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th, table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
        }

        table th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 600;
        }

        table tr:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 Thống Kê & Báo Cáo Doanh Thu</h1>
</div>

<!-- Thẻ chỉ số tổng quan -->
<div class="cards">
    <div class="card">
        <h3>Tổng Số Đơn Hàng</h3>
        <div class="value" id="totalOrders">0</div>
    </div>
    <div class="card green">
        <h3>Tổng Doanh Thu</h3>
        <div class="value" id="totalRevenue">0 VNĐ</div>
    </div>
</div>

<!-- Biểu đồ & Bảng chi tiết -->
<div class="content-grid">
    <div class="panel">
        <h2>📈 Top Sản Phẩm Bán Chạy (Số lượng)</h2>
        <canvas id="topProductsChart"></canvas>
    </div>

    <div class="panel">
        <h2>📦 Bảng Chi Tiết Sản Phẩm Bán Chạy</h2>
        <table>
            <thead>
            <tr>
                <th>Mã SP</th>
                <th>Tên Sản Phẩm</th>
                <th>Đã Bán</th>
                <th>Doanh Thu</th>
            </tr>
            </thead>
            <tbody id="productTableBody">
            <!-- Dữ liệu API tự động đổ vào đây -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8081/api/reports';

    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    async function fetchOverview() {
        try {
            const response = await fetch(`${API_BASE}/overview`);
            const data = await response.json();

            document.getElementById('totalOrders').innerText = data.totalOrders;
            document.getElementById('totalRevenue').innerText = formatCurrency(data.totalRevenue);
        } catch (error) {
            console.error("Lỗi lấy dữ liệu tổng quan:", error);
        }
    }

    async function fetchTopSelling() {
        try {
            const response = await fetch(`${API_BASE}/top-selling`);
            const products = await response.json();

            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            const labels = [];
            const quantities = [];

            products.forEach(p => {
                labels.push(p.productName);
                quantities.push(p.totalQuantitySold);

                const row = `
                        <tr>
                            <td>#${p.productId}</td>
                            <td><strong>${p.productName}</strong></td>
                            <td>${p.totalQuantitySold}</td>
                            <td>${formatCurrency(p.totalRevenue)}</td>
                        </tr>
                    `;
                tbody.innerHTML += row;
            });

            renderChart(labels, quantities);

        } catch (error) {
            console.error("Lỗi lấy danh sách sản phẩm bán chạy:", error);
        }
    }

    function renderChart(labels, dataValues) {
        const ctx = document.getElementById('topProductsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Số lượng đã bán',
                    data: dataValues,
                    backgroundColor: '#3498db',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1 }
                    }
                }
            }
        });
    }

    window.onload = () => {
        fetchOverview();
        fetchTopSelling();
    };
</script>
</body>
</html>
